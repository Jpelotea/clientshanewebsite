name: Validate website

on:
  push:
    branches:
      - main
      - 'chore/**'
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install PDF system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ghostscript poppler-utils

      - name: Install source-validator dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Require committed lockfile
        run: test -s package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source structure
        run: npm run validate:source

      - name: Verify and validate Career-Fit Guide PDF
        run: |
          npm run verify:career-guide
          npm run --silent validate:pdf -- --render-dir pdf-validation-renders | tee pdf-validation.json
          npm run test:pdf

      - name: Run unit tests
        run: npm test

      - name: Run Astro and TypeScript checks
        run: npm run check 2>&1 | tee astro-check.log

      - name: Build production output
        env:
          PUBLIC_SITE_READY: 'false'
          PUBLIC_SHOW_DRAFT_CONTENT: 'false'
          PUBLIC_PROFILE_CLAIMS_VERIFIED: 'false'
          PUBLIC_FORMS_ENABLED: 'false'
          PUBLIC_SITE_URL: 'https://shane-perez-staging.netlify.app'
        run: npm run build 2>&1 | tee build.log

      - name: Run Netlify local smoke test
        env:
          PUBLIC_SITE_READY: 'false'
          PUBLIC_SHOW_DRAFT_CONTENT: 'false'
          PUBLIC_PROFILE_CLAIMS_VERIFIED: 'false'
          PUBLIC_FORMS_ENABLED: 'false'
          PUBLIC_SITE_URL: 'http://localhost:8888'
        run: npm run netlify:smoke 2>&1 | tee netlify-smoke-output.log

      - name: Upload PDF validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: career-guide-pdf-validation
          path: |
            pdf-validation.json
            pdf-validation-renders
            public/documents/financial-advisor-career-fit-guide-draft.pdf
          retention-days: 30
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            astro-check.log
            build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Netlify local smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-local-smoke-log
          path: |
            /tmp/shane-netlify-dev.log
            netlify-smoke-output.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Create validated source archive
        run: git archive --format=zip --output=shane-perez-website-source.zip HEAD

      - name: Upload validated static build
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('dist/**') != ''
        with:
          name: dist
          path: dist
          if-no-files-found: ignore

      - name: Upload validated source archive
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: shane-perez-website-source
          path: shane-perez-website-source.zip
          if-no-files-found: error
