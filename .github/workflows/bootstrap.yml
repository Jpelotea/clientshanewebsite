name: Bootstrap reviewed website project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: chore/technical-validation-and-staging

      - name: Reconstruct and extract reviewed project
        run: |
          cat bootstrap-parts/part-* > /tmp/project-bootstrap.b64
          base64 --decode /tmp/project-bootstrap.b64 > /tmp/project-bootstrap.zip
          echo "e83e48c80bbe8cbc08a0e26927b0ced7484d8add36ca0819a95f8466221bcdb7  /tmp/project-bootstrap.zip" | sha256sum --check --strict
          unzip -q -o /tmp/project-bootstrap.zip -d .
          rm -rf bootstrap-parts project-bootstrap.zip project-bootstrap.b64.* .github/workflows/bootstrap.yml

      - name: Commit initialized project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize Shane Perez website project"
          git push origin "HEAD:chore/technical-validation-and-staging"
