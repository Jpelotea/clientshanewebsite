name: Bootstrap reviewed website project

on:
  push:
    branches:
      - chore/technical-validation-and-staging

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4

      - name: Extract reviewed project
        run: |
          unzip -q -o project-bootstrap.zip -d .
          rm -f project-bootstrap.zip .github/workflows/bootstrap.yml

      - name: Commit initialized project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: initialize Shane Perez website project"
          git push origin "HEAD:${GITHUB_REF_NAME}"
