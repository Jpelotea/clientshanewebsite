name: Commit regenerated Career-Fit Guide

on:
  push:
    branches:
      - chore/technical-validation-and-staging

permissions:
  contents: write

# One-time Issue #2 repair workflow. It removes itself after committing the regenerated PDF.
jobs:
  commit-guide:
    if: github.event.head_commit.message == 'chore: stage regenerated career guide artifact'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: chore/technical-validation-and-staging
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install PDF system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ghostscript poppler-utils

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Regenerate and validate guide
        run: |
          python3 scripts/generate_career_guide.py
          python3 scripts/validate_pdf.py --source public/documents/financial-advisor-career-fit-guide-draft.pdf --render-dir /tmp/career-guide-renders
          python3 scripts/test_pdf_validation.py

      - name: Commit regenerated binary and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/documents/financial-advisor-career-fit-guide-draft.pdf
          git rm .github/workflows/commit-career-guide.yml
          git commit -m 'fix: commit regenerated career guide'
          git push origin HEAD:chore/technical-validation-and-staging
